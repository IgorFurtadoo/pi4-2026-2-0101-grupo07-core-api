# Compose apenas para desenvolver o Core API com o seu MySQL.
# Onde mora o compose do sistema inteiro ainda não foi decidido.

services:
  core-db:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: core
      MYSQL_USER: ${DB_USER:?defina DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      # Senha de root aleatória: o serviço só usa o usuário acima.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - core-db-data:/var/lib/mysql
      # Roda só na criação do volume (banco vazio).
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # Pelo 127.0.0.1 (TCP), que só abre depois de o schema.sql rodar.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sem "ports": o banco só é acessível pela rede interna do compose.

  core-api:
    build: .
    env_file: .env
    depends_on:
      core-db:
        condition: service_healthy
    ports:
      # Só no loopback. O SERVER_PORT do .env precisa continuar 8080.
      - "127.0.0.1:8080:8080"

volumes:
  core-db-data:
